<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>نظام التحكم المركزي</title>

            background-color: #030712;

            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        h1 {
            font-size: 22px;
            text-shadow: 0 0 10px #00ffcc;
            margin-top: 10px;
        }
        .scanner-box {
            border: 2px dashed #00ffcc;
            padding: 15px;
            margin: 20px auto;
            width: 85%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            background: rgba(0, 255, 204, 0.05);
        }
        .status {
            font-size: 16px;
            color: #ff0055;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 8px #ff0055;
        }
        .meter {
            height: 15px;
            width: 100%;
            background: #111;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #00ffcc, #ff0055);
            animation: pulse 2s infinite alternate;
        }
